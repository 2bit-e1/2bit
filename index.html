<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="2bit" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2bit.works</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }

      .boot-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      .boot-preloader video {
        width: 100px;
        height: 100px;
        object-fit: contain;
      }

      @media (max-width: 1024px) {
        .boot-preloader {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-preloader" aria-hidden="true">
        <video autoplay loop muted playsinline preload="auto">
          <source src="/src/assets/preloadanim.mp4" type="video/mp4" />
        </video>
      </div>
    </div>
    <script>
      // The bio page must not stay behind the boot overlay while the app downloads.
      if (/^\/me\/?$/.test(window.location.pathname)) {
        window.setTimeout(() => {
          const preloader = document.querySelector('.boot-preloader');
          preloader?.querySelector('video')?.pause();
          preloader?.remove();
        }, 5000);
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
